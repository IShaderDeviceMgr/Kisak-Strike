[package]
name = "source-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust rewrite of the Source engine, targeting Portal 2. See ../PORTING.md."

# One project, one manifest. Every former Valve module (engine, filesystem,
# materialsystem, ...) becomes a module under src/, not a separate crate and
# not a separate shared library -- see ../PORTING.md, "Architecture".
#
# No build.rs, no CMake, no C++. The legacy C++ tree in the repo root is the
# reference implementation this is replacing, not a dependency.

[dependencies]
# wgpu's adapter and device requests are async, and startup is not. pollster is
# the whole of an executor for exactly that: block the calling thread on one
# future. Nothing else in the engine is async, and adding a real runtime
# (tokio/async-std) to await two calls made once at boot would be the tail
# wagging the dog. Revisit only if async arrives for its own reasons -- the
# filesystem's deferred async path is the likeliest candidate.
pollster = "1.0.1"
# Plain-old-data casts for the bytes that go to the GPU: uniform blocks and
# vertex buffers. `portdocs/MATERIALSYSTEM.md` §4.4 names it as the replacement
# for `CMeshBuilder` (`public/materialsystem/imesh.h`, 4,402 lines of inlined
# attribute-at-a-time writes through a `VertexFormat_t` bitfield) and §7.4 as
# the way the constant-register ABI becomes one set of `#[repr(C)]` structs.
#
# The alternative is a hand-written `to_bytes` per struct, which is the
# std140-style padding rules re-derived by hand for every uniform block -- the
# exact kind of hand-rolling ../PORTING.md says to spend a dependency on. Zero
# dependencies of its own, and `derive` is what makes the structs declare their
# own layout instead of a `unsafe` cast at each call site.
bytemuck = { version = "1", features = ["derive"] }
# Error enums. PORTING.md's "What idiomatic means concretely" names thiserror as
# the replacement for Valve's bool-return/sentinel error convention.
#
# Deliberately NOT here: binrw/deku, which portdocs/FILESYSTEM.md suggested for
# the VPK directory and portdocs/MATERIALSYSTEM.md for the VTF header. Neither
# is the fixed-struct-array shape those crates are good at:
#
#   - The VPK directory is a variable-length nested NUL-terminated string tree
#     (extension -> dir -> basename), which a derive macro can't describe at all
#     -- you end up hand-writing the parse impl regardless.
#   - The VTF header is four inherited pack(1) structs whose true layout exists
#     only in a comment (public/vtf/vtf.h:300), with hand-written padding, a
#     version-dependent tail, and fields at unaligned offsets. Declaring that is
#     longer and less legible than reading fifteen fields at named offsets.
#
# Both use a bounds-checked read instead, which is what "modernize the
# mechanism" actually asks for: no unchecked pointer arithmetic, every read
# validated. Revisit if a format arrives that really is a struct array --
# .bsp lumps and .mdl are the candidates.
thiserror = "2"
# The renderer. Replaces materialsystem/shaderapidx9 + glmgr + togl outright --
# see portdocs/MATERIALSYSTEM.md, "Headline decision". Used directly from inside
# src/materials/; there is no device-abstraction layer over it, because wgpu
# already is one.
wgpu = "30.0.1"
# Windowing and input. Replaces ILauncherMgr, appframework/sdlmgr.cpp,
# appframework/cocoamgr.mm and the vendored thirdparty/SDL2. 0.30 is the current
# stable line; 0.31 is in beta and its ApplicationHandler API differs, so the
# upgrade is a deliberate change to src/engine/window/, not a version bump.
winit = "0.30.13"
# Vector and matrix math. Replaces `mathlib/` -- PORTING.md's dependency graph
# for materialsystem names the substitution directly ("mathlib (-> glam)"), and
# `VMatrix`/`matrix3x4_t` are the shapes it stands in for. Arrives with stage 4's
# matrix stack, which is the first thing in the port that multiplies matrices
# rather than passing them through.
#
# The alternative is a hand-written Mat4: ~200 lines of multiply, inverse,
# perspective and orthographic construction, each of which is a place to put a
# sign error that renders a plausible wrong picture. glam has no dependencies of
# its own and is SIMD-accelerated on the targets this port supports.
#
# Note the convention it settles, which `src/materials/uniforms.rs` documents at
# length: glam::Mat4 is column-major and multiplies on the left, so it *is* this
# port's convention rather than a thing to convert out of. Valve's row-major
# VMatrix is what needs converting, and `uniforms::from_row_major` is where.
glam = "0.33.6"
# The UI. Replaces vgui2 (`vgui2/vgui_controls/`, and `consoledialog.cpp` in
# particular), RocketUI and ScaleformUI at once -- ../PORTING.md's
# "Replacements, all decided". Arrives with the dev console
# (`portdocs/ENGINE_CONSOLE.md` stage 4), which is the first thing in the port
# that needs a widget at all.
#
# Three crates because the integration is deliberately three-layered, the same
# way the input path already is: `egui` is the widgets and knows nothing about
# a platform, `egui-winit` is the winit boundary, `egui-wgpu` the wgpu one.
# That maps exactly onto `window/` translating, `console/ui.rs` deciding and
# `materials/ui.rs` drawing, and it is why the console dialog can be built and
# asserted on with no window and no GPU.
#
# 0.36.1 requires `wgpu ^30.0` and `winit ^0.30.13`, which are the versions
# already pinned above; an egui upgrade is therefore coupled to those two and
# is a deliberate change rather than a version bump.
#
# The footprint is real and is worth stating: unlike `glam` and `bytemuck`,
# these are not zero-dependency. `egui` brings `epaint`/`emath`, `ahash`,
# `smallvec`, `unicode-segmentation`, `itertools`, `accesskit` and `log`;
# `egui-winit` brings `arboard` (the system clipboard, which a console entry
# genuinely wants) and `raw-window-handle`. The alternative is hand-writing a
# text entry, a scrolling text view, font rasterization and clipboard
# integration, which is what the 1,553 lines of `consoledialog.cpp` plus the
# whole of `vgui2/` were.
#
# `default-features = false` on the two integration crates drops what this
# port does not want: `egui-winit`'s `links` feature pulls `webbrowser` in to
# open hyperlinks, and a game console has no business launching a browser;
# `egui-wgpu`'s defaults add `wgpu/webgl`, which is dead weight in a native
# binary. `clipboard`, `wayland` and `x11` are kept because Linux is the
# primary target and all three are load-bearing there.
egui = "0.36.1"
egui-winit = { version = "0.36.1", default-features = false, features = [
    "clipboard",
    "wayland",
    "x11",
] }
egui-wgpu = { version = "0.36.1", default-features = false, features = [
    # `wgpu/metal`, under a name that says what it is for. macOS is a supported
    # target and this is the fix for a live-resize artifact there.
    "macos-window-resize-jitter-fix",
] }

[profile.release]
lto = true
codegen-units = 1
